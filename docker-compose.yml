# docker-compose.yml
# Production configuration for beehiveJournal.
#
# Three services:
#   app     — SvelteKit Node.js server (internal network only, never exposed publicly)
#   nginx   — Reverse proxy + TLS termination (ports 80 + 443)
#   certbot — Let's Encrypt certificate issuance and renewal
#
# Usage:
#   Initial certificate:  see docs/runbook.md §3
#   Normal start:         docker compose up -d
#   Update app:           git pull && docker compose build app && docker compose up -d app
#   View logs:            docker logs -f beehivejournal-app

services:
  # ── App ──────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beehivejournal-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/db.sqlite
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - BODY_SIZE_LIMIT=10485760
    volumes:
      # Story 8.2 AC1: named volume at /data — database never inside image layer
      - app-data:/data
    # Story 8.1 AC4: NOT exposed on any public port.
    # Nginx proxies to it via the internal Docker bridge network (app:3000).
    expose:
      - '3000'
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: beehivejournal-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt certificates (shared with certbot)
      - certbot-etc:/etc/letsencrypt:ro
      # ACME webroot challenge directory (shared with certbot)
      - certbot-www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      - app

  # ── Certbot ───────────────────────────────────────────────────────────────
  # One-shot issuance:
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d journal.example.com \
  #     --email you@example.com --agree-tos --no-eff-email
  #
  # Renewal (run from cron on the host — see docs/runbook.md §5):
  #   docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    container_name: beehivejournal-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Story 8.2 AC1-3: SQLite database — survives restarts, recreations, and rebuilds.
  # Destroyed only by: docker compose down -v  (explicit volume removal).
  app-data:
    driver: local
  # Let's Encrypt certificates and account data
  certbot-etc:
    driver: local
  # ACME webroot challenge files served by Nginx at /.well-known/acme-challenge/
  certbot-www:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
